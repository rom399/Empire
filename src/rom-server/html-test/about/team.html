<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team - Empire</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #ecf0f1; }
        h1 { color: #2c3e50; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .team-member { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .team-member img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; }
        .team-member h3 { margin: 10px 0 5px; color: #2c3e50; }
        .team-member p { color: #7f8c8d; margin: 0; }
        a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
    <h1>👥 Our Team</h1>
    
    <div class="team-grid">
        <div class="team-member">
            <img src="../images/sample1.png" alt="Team Member 1">
            <h3>Alice Developer</h3>
            <p>Lead Developer</p>
        </div>
        <div class="team-member">
            <img src="../images/sample2.png" alt="Team Member 2">
            <h3>Bob Designer</h3>
            <p>UI/UX Designer</p>
        </div>
        <div class="team-member">
            <img src="../images/sample1.png" alt="Team Member 3">
            <h3>Charlie Manager</h3>
            <p>Project Manager</p>
        </div>
    </div>
    
    <p style="margin-top: 30px;"><a href="index.html">← Back to About</a></p>
</body>
</html>
