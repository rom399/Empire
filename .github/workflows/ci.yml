name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: src/empire

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/empire/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx vitest run
